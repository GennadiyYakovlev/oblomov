project_root: .
content_glob: "[0-9][0-9]_*"
include_extensions:
  - ".md"
exclude_dirs:
  - ".git"
  - ".meta"
  - "__reports"
  - "tools"
output:
  meta_root: ".meta/text-analytics"
  json_dir: ".meta/text-analytics/json"
  file_metrics_dir: ".meta/text-analytics/json/file_metrics"
  reports_root: "../_sys/__reports/text-analytics"
  chapters_reports_dir: "../_sys/__reports/text-analytics/chapters"
text:
  dialogue_prefix: "— "
  min_word_length_for_top: 2
  top_words_limit: 30
stopwords:
  - "и"
  - "в"
  - "во"
  - "не"
  - "что"
